<!DOCTYPE html>
<html lang="{{locale}}" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>{{subject}}</title>
<!--
  GastroIQ email verification code. The texts live in VerificationEmailTemplate.
  Email-safe: tables + inline styles only. No SVG, no CSS variables, no web fonts required.
-->
<style>
  @media (max-width: 600px) {
    .gq-card { padding: 34px 21px !important; }
    .gq-h1 { font-size: 26px !important; line-height: 32px !important; }
    .gq-code { font-size: 30px !important; letter-spacing: 8px !important; }
  }
</style>
</head>
<body style="margin:0; padding:0; background-color:#F2F3F6; -webkit-text-size-adjust:100%;">
  <!-- Preheader: shows in the inbox preview, hidden in the email -->
  <div style="display:none; max-height:0; overflow:hidden; mso-hide:all; font-size:1px; line-height:1px; color:#F2F3F6;">{{preheader}}&#8202;&#847;&#8202;&#847;&#8202;&#847;&#8202;&#847;&#8202;&#847;&#8202;&#847;</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F2F3F6;">
    <tr>
      <td align="center" style="padding:34px 13px;">

        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">
          <!-- Logo -->
          <tr>
            <td align="left" style="padding:0 8px 21px 8px;">
              <img src="{{logo_url}}" width="132" height="31" alt="GastroIQ" style="display:block; border:0; outline:none; text-decoration:none; width:132px; height:31px; font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif; font-size:21px; font-weight:800; color:#14161A;">
            </td>
          </tr>

          <!-- Card -->
          <tr>
            <td class="gq-card" style="background-color:#FFFFFF; border-radius:21px; padding:34px 34px 34px 34px; border:1px solid #E2E5EA;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif; color:#14161A;">
                    <h1 class="gq-h1" style="margin:0 0 21px 0; font-size:34px; line-height:40px; font-weight:700; letter-spacing:-0.5px; color:#14161A;">{{heading}}</h1>
                    <p style="margin:0 0 13px 0; font-size:16px; line-height:26px; color:#14161A;">{{greeting}}</p>
                    <p style="margin:0 0 21px 0; font-size:16px; line-height:26px; color:#14161A;">{{intro}}</p>
                  </td>
                </tr>

                <!-- Code -->
                <tr>
                  <td align="center" style="padding:0 0 13px 0;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#E1F0EB; border-radius:13px;">
                      <tr>
                        <td align="center" style="padding:21px 13px;">
                          <div class="gq-code" style="font-family:'SF Mono','Menlo','Consolas','Courier New',monospace; font-size:38px; line-height:44px; font-weight:700; letter-spacing:12px; color:#175446; mso-line-height-rule:exactly;">{{code}}</div>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
                <tr>
                  <td align="center" style="padding:0 0 34px 0; font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif; font-size:13px; line-height:21px; color:#5F646D;">
                    {{expiry}}
                  </td>
                </tr>

                <!-- Note -->
                <tr>
                  <td style="font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F2F3F6; border-radius:13px;">
                      <tr>
                        <td style="padding:13px 21px; font-size:13px; line-height:21px; color:#5F646D;">{{ignore_note}}</td>
                      </tr>
                    </table>
                    <p style="margin:21px 0 0 0; font-size:16px; line-height:26px; color:#14161A;">{{signoff}}</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:21px 8px 0 8px; font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif; font-size:13px; line-height:21px; color:#5F646D;">
              <p style="margin:0 0 8px 0;">{{help_line}}</p>
              <p style="margin:0 0 8px 0;">{{sent_to_line}}</p>
              <p style="margin:0;">{{company_line}}</p>
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>
</body>
</html>
